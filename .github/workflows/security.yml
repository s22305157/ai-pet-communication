name: Structure and security regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rules-and-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            tools/security/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
        working-directory: functions
      - run: npm run lint && npm test && npm audit --omit=dev
        working-directory: functions
      - run: npm ci --ignore-scripts && npm run security:patch && npm test
        working-directory: tools/security
      - name: Journal M0-M1 callable and storage integration
        run: node tools/security/node_modules/firebase-tools/lib/bin/firebase.js emulators:exec --config firebase.journal-test.json --project demo-pawlink-security --only auth,firestore,storage,functions "node --test tools/security/journal.test.cjs"
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter build web --release --no-pub
